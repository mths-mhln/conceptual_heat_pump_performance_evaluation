[ANALYSIS TYPE]

; Verification of the full optimization against Martin T. White's pocketTHERM heat pump calculator, see verification.md
analysis_type = CHPC
calculation_method = full_optimization



[ANALYSIS SPECIFICATIONS]

; Overwritten by verification.py, which evaluates R1233zd(E), n-pentane and MM
refrigerant = R1233zd(E)

; Heat sink inlet temperature [K] (80 degC), mass flow rate [kg/s] and specific heat capacity [J/kg/K]
T_h_in = 353.15
ṁ_h = 40
cp_h = 1885

; Heat source inlet temperature [K] (15 degC), mass flow rate [kg/s] and specific heat capacity [J/kg/K]
T_c_in = 287.15
ṁ_c = 40
cp_c = 1006

; Isenthalpic expansion is enforced, since the MTW code is unable to simulate turbine expansion processes. 
; The shaft connection efficiency is not accounted for by the MTW code.
η_turb = 0
η_compr = 0.78
η_shaft = 1.00

; Minimum pinch-point temperature difference in the evaporator and condenser [K], and required heat output [W]
ΔT_pp_min_evap = 10
ΔT_pp_min_cond = 10
Q_out_req = 200000
