[THERMOPLOT SETTINGS]

; p-h diagram background of the conceptual heat pump cycle diagrams. fluid_name, P_range and H_range 
; are overwritten by CHPC, such that the diagram is centred around the cycle of the analysed refrigerant.
; See the thermoplot README for the other settings.
diagram_type = PH
fluid_name = R1234ze(E)
show_spinodal = False
show_isolines = True
show_critical_point = True
show_critical_isoline = True
P_range = [1e5, 1e7]
H_range = [150e3, 500e3]
n_pts = 400

; LaTeX formatting is necessary for the performance box in the cycle diagrams
latex_formatting = True
