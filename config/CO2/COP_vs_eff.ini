[ANALYSIS TYPE]

; Analysis to perform - [ CHPC / COP_vs_eff ]
; CHPC       | evaluates the conceptual heat pump cycle according to the specifications below
; COP_vs_eff | evaluates the COP variation for different turbine and compressor efficiencies
analysis_type = COP_vs_eff

; Cycle calculation method - [ full_optimization / three_temp_fix / fixed_PR ] - Default: full_optimization
; full_optimization | optimizes PR, T_ref_1, s_ref_1 and T_ref_3, subject to the minimum pinch-point temperature differences
; three_temp_fix    | fixes ΔT_pp_1, ΔT_pp_3, ΔT_pp_4 and ΔT_sh, and only optimizes PR (approach of thermodynamics_legacy_4)
; fixed_PR          | optimizes T_ref_1, s_ref_1 and T_ref_3 at the specified PR
calculation_method = full_optimization



[ANALYSIS SPECIFICATIONS]

; Refrigerant, following the CoolProp naming convention
refrigerant = CO2

; Heat sink inlet temperature [K] (47 degC), mass flow rate [kg/s] and specific heat capacity [J/kg/K] (steam at 250 degC)
T_h_in = 320
ṁ_h = 0.5
cp_h = 1885

; Heat source inlet temperature [K] (17 degC), mass flow rate [kg/s] and specific heat capacity [J/kg/K] (air at 30 degC and atmospheric pressure)
T_c_in = 290
ṁ_c = 0.5
cp_c = 1006

; Turbine/compressor shaft connection efficiency [-] - Default: 1
η_shaft = 0.98

; Minimum pinch-point temperature difference in the evaporator and condenser [K], and required heat output [W]. 
; Only for full_optimization and fixed_PR
ΔT_pp_min_evap = 10
ΔT_pp_min_cond = 10
Q_out_req = 10000

; Compressor pressure ratio [-]. Only for fixed_PR
; PR = 4.0

; Temperature differences [K] at the evaporator outlet (ΔT_pp_1), condenser outlet (ΔT_pp_3) and evaporator inlet 
; (ΔT_pp_4), and the superheat (ΔT_sh). Only for three_temp_fix
; ΔT_pp_1 = 10
; ΔT_pp_3 = 10
; ΔT_pp_4 = 10
; ΔT_sh = 5



[COP VS EFF SETTINGS]

; Lower and upper bound of the turbine and compressor efficiency [-]
η_turb_bounds = [0.01, 1.0]
η_compr_bounds = [0.5, 1.0]

; Number of turbine and compressor efficiencies, the bounds included. The COP is evaluated for n_η x n_η cycles
n_η = 20

; Behaviour when a complete sweep already exists - [ prompt / abort / recompute ] - Default: prompt
existing_complete_sweep_action = prompt



[NUMERICS]

; Number of points along the isobars, used for the heat transfer integration and the diagram data - Default: 150
n_pts = 150
