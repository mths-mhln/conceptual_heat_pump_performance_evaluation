[project]
name = "00-calculation-tool"
version = "0.1.0"
description = "Conceptual heat pump cycle (CHPC) performance evaluation, including a local copy of thermoplot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coolprop>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
